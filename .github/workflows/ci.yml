name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Download size within budget
        run: pnpm check:size
      - name: Dependency licences allowed
        run: pnpm check:licences
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e e2e/smoke.spec.ts e2e/sandbox.spec.ts e2e/match.spec.ts e2e/tune.spec.ts e2e/hud.spec.ts e2e/perf.spec.ts e2e/gamepad.spec.ts
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  balance:
    # CPU-vs-CPU matches and exploit bots (docs/specs/11 §6). Fails when an enforced balance target is missed.
    # The report goes in the job summary and, on PRs, in a comment next to the base branch's numbers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Play the balance matches
        run: pnpm balance
      - name: Same on the base branch, for comparison
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/balance/vitest.config.ts ]; then
            ln -s "$PWD/node_modules" ../base/node_modules
            (cd ../base && pnpm balance) || true
          fi
      - name: Report
        if: always()
        run: pnpm balance:report balance-report ../base/balance-report
      - name: Post the report on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- balance-report -->";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const path = "balance-report/report.md";
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, "utf8")
              : "### Balance report\n\nThe balance run didn't finish.";
            const body = [marker, report, "", `For ${sha}, base \`${context.payload.pull_request.base.ref}\`: [CI run](${run})`].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  screenshots:
    # Renders the look-test (every look/time/weather) and the match, for visual review of each PR.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        set: [looktest, match]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ${{ matrix.set == 'match' && 'screenshots:match' || 'screenshots' }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.set }}
          path: screenshots

  screenshots-link:
    # Links the screenshots from the PR (one comment, updated on every push).
    needs: screenshots
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- screenshots-link -->";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Screenshots** for ${sha}: [download from this CI run](${run}#artifacts)`,
              "",
              "- `screenshots-match`: the match by day (centre, near corner, at goal, ball in the air) and at night in the rain",
              "- `screenshots-looktest`: every look, time of day and weather",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
